[project]
name = "smart-novel-llm-gateway"
version = "0.0.0"
description = "OpenAI-compatible gateway for smart-novel: chat completions via llama.cpp, speech via Qwen3-TTS."
requires-python = "==3.12.*"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "torch",
    "torchaudio",
    "qwen-tts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "soundfile",
    "huggingface_hub",
]

[dependency-groups]
dev = ["ruff", "pre-commit"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
